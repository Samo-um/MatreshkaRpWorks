name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ls -la
          unzip -o '*.zip' || true
          find . -name "*.zip" -exec unzip -o {} \; || true
          rm -f *.zip || true
          ls -la
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          GRADLE=$(find . -name gradlew -type f | head -n 1)
          echo "Found gradle at $GRADLE"
          chmod +x "$GRADLE"
          DIR=$(dirname "$GRADLE")
          cd "$DIR"
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: "**/*.apk"
