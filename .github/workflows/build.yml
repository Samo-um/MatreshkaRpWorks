name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: |
          mkdir -p app/src/main/java/com/matreshka/works
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }" > build.gradle
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' } 
          android { namespace 'com.matreshka.works'; compileSdk 34; defaultConfig { applicationId 'com.matreshka.works'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' } }" > app/build.gradle
          mkdir -p app/src/main
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Matreshka"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.matreshka.works; import android.os.Bundle; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity; class MainActivity: AppCompatActivity() { override fun onCreate(b: Bundle?) { super.onCreate(b); val tv = TextView(this); tv.text = "Matreshka RP Works\nAPK готов!"; tv.textSize = 24f; tv.setPadding(50,200,50,50); setContentView(tv) } }' > app/src/main/java/com/matreshka/works/MainActivity.kt
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: APK, path: app/build/outputs/apk/debug/app-debug.apk }
