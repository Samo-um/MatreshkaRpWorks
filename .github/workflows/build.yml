name: Build Chat
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          python3 <<'PY'
          import os, pathlib
          def w(p,c): pathlib.Path(p).parent.mkdir(parents=True, exist_ok=True); open(p,'w',encoding='utf-8').write(c)
          w('settings.gradle','include ":app"\n')
          w('build.gradle','buildscript{repositories{google();mavenCentral()}dependencies{classpath "com.android.tools.build:gradle:8.2.2"}}')
          w('app/build.gradle','plugins{id "com.android.application"}\nandroid{namespace="com.matreshka.works";compileSdk 34;defaultConfig{applicationId "com.matreshka.works";minSdk 24;targetSdk 34;versionCode 2;versionName "2.0-Chat"};compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}}\ndependencies{implementation "androidx.appcompat:appcompat:1.6.1";implementation "com.google.android.material:material:1.11.0";implementation "androidx.recyclerview:recyclerview:1.3.2";implementation "androidx.constraintlayout:constraintlayout:2.1.4"}\n')
          w('app/src/main/res/values/strings.xml','<resources><string name="app_name">Matreshka Chat</string><string name="chat">Чат</string><string name="manifest">Манифест</string><string name="icon">Иконка</string><string name="admin">Админ</string><string name="hint">Задай вопрос...</string><string name="send">Отправить</string></resources>')
          w('app/src/main/res/values/colors.xml','<resources><color name="purple">#7B2CFF</color><color name="bg">#0F0F0F</color></resources>')
          w('app/src/main/res/values/themes.xml','<resources><style name="Theme.Matreshka" parent="Theme.Material3.DayNight"><item name="colorPrimary">@color/purple</item></style></resources>')
          w('app/src/main/res/layout/activity_main.xml','<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent"><FrameLayout android:id="@+id/container" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/><com.google.android.material.bottomnavigation.BottomNavigationView android:id="@+id/nav" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#111" app:menu="@menu/bottom_menu" xmlns:app="http://schemas.android.com/apk/res-auto"/></LinearLayout>')
          w('app/src/main/res/menu/bottom_menu.xml','<menu xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@+id/nav_chat" android:title="Чат" android:icon="@android:drawable/sym_action_chat"/><item android:id="@+id/nav_manifest" android:title="Манифест" android:icon="@android:drawable/ic_menu_agenda"/><item android:id="@+id/nav_icon" android:title="Иконка" android:icon="@android:drawable/sym_def_app_icon"/><item android:id="@+id/nav_admin" android:title="Админ" android:icon="@android:drawable/ic_menu_preferences"/></menu>')
          w('app/src/main/res/layout/fragment_chat.xml','<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent" android:padding="12dp"><androidx.recyclerview.widget.RecyclerView android:id="@+id/rv" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/><LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="wrap_content"><EditText android:id="@+id/input" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:hint="@string/hint"/><Button android:id="@+id/btnSend" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="@string/send"/></LinearLayout></LinearLayout>')
          w('app/src/main/res/layout/item_message.xml','<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="8dp"><TextView android:id="@+id/tvUser" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#7B2CFF"/><TextView android:id="@+id/tvMsg" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout>')
          w('app/src/main/res/layout/fragment_manifest.xml','<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:id="@+id/tvManifest" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:fontFamily="monospace" android:textSize="12sp"/></ScrollView>')
          w('app/src/main/res/layout/fragment_icon.xml','<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:gravity="center" android:layout_width="match_parent" android:layout_height="match_parent"><ImageView android:layout_width="120dp" android:layout_height="120dp" android:src="@mipmap/ic_launcher"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Matreshka Chat v2.0\nЧат со мной" android:gravity="center" android:paddingTop="16dp"/></LinearLayout>')
          w('app/src/main/res/layout/fragment_admin.xml','<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="Админ-панель (пароль: matreshka)" android:layout_width="wrap_content" android:layout_height="wrap_content"/><EditText android:id="@+id/etPass" android:hint="Пароль" android:layout_width="match_parent" android:layout_height="wrap_content"/><Button android:id="@+id/btnLogin" android:text="Войти как админ" android:layout_width="match_parent" android:layout_height="wrap_content"/><TextView android:id="@+id/tvStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:paddingTop="16dp"/><Button android:id="@+id/btnClear" android:text="Очистить чат" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout>')
          w('app/src/main/AndroidManifest.xml','<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="@string/app_name" android:theme="@style/Theme.Matreshka" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          w('app/src/main/java/com/matreshka/works/MainActivity.kt','package com.matreshka.works\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\nimport androidx.fragment.app.Fragment\nclass MainActivity:AppCompatActivity(){\n fun load(f:Fragment){supportFragmentManager.beginTransaction().replace(R.id.container,f).commit()}\n override fun onCreate(b:Bundle?){\n super.onCreate(b); setContentView(R.layout.activity_main)\n load(ChatFragment())\n findViewById<com.google.android.material.bottomnavigation.BottomNavigationView>(R.id.nav).setOnItemSelectedListener{\n when(it.itemId){\n R.id.nav_chat->load(ChatFragment())\n R.id.nav_manifest->load(ManifestFragment())\n R.id.nav_icon->load(IconFragment())\n R.id.nav_admin->load(AdminFragment())\n };true\n }\n }\n}\nobject ChatStore{val msgs=mutableListOf<Pair<String,String>>(); var isAdmin=false}\nclass ChatFragment:Fragment(R.layout.fragment_chat){\n override fun onViewCreated(v:android.view.View,b:Bundle?){\n val rv=v.findViewById<androidx.recyclerview.widget.RecyclerView>(R.id.rv)\n val input=v.findViewById<android.widget.EditText>(R.id.input)\n val btn=v.findViewById<android.widget.Button>(R.id.btnSend)\n rv.layoutManager=androidx.recyclerview.widget.LinearLayoutManager(context)\n val ad=object:androidx.recyclerview.widget.RecyclerView.Adapter<VH>(){\n override fun onCreateViewHolder(p:android.view.ViewGroup,vt:Int)=VH(android.view.LayoutInflater.from(p.context).inflate(R.layout.item_message,p,false))\n override fun getItemCount()=ChatStore.msgs.size\n override fun onBindViewHolder(h:VH,i:Int){h.user.text=ChatStore.msgs[i].first; h.msg.text=ChatStore.msgs[i].second}\n }\n rv.adapter=ad\n if(ChatStore.msgs.isEmpty()) ChatStore.msgs.add("Система" to "Добро пожаловать в Matreshka Chat! Задай любой вопрос.")\n btn.setOnClickListener{\n val t=input.text.toString().trim(); if(t.isEmpty()) return@setOnClickListener\n ChatStore.msgs.add((if(ChatStore.isAdmin)"Админ" else "Игрок") to t)\n if(!ChatStore.isAdmin) ChatStore.msgs.add("Ты (владелец)" to "Получил: "+t+" — отвечу скоро!")\n input.text.clear(); ad.notifyDataSetChanged(); rv.scrollToPosition(ChatStore.msgs.size-1)\n }\n }\n class VH(v:android.view.View):androidx.recyclerview.widget.RecyclerView.ViewHolder(v){val user=v.findViewById<android.widget.TextView>(R.id.tvUser); val msg=v.findViewById<android.widget.TextView>(R.id.tvMsg)}\n}\nclass ManifestFragment:Fragment(R.layout.fragment_manifest){override fun onViewCreated(v:android.view.View,b:Bundle?){v.findViewById<android.widget.TextView>(R.id.tvManifest).text="<manifest>\\n  package=com.matreshka.works\\n  version=2.0-Chat\\n  admin-feature=enabled\\n  chat-mode=direct-with-owner\\n  players-can-ask-anything=true\\n</manifest>\\n\\n+ иконка, + админка, + чат как в Телеге" }}\nclass IconFragment:Fragment(R.layout.fragment_icon)\nclass AdminFragment:Fragment(R.layout.fragment_admin){override fun onViewCreated(v:android.view.View,b:Bundle?){\n val pass=v.findViewById<android.widget.EditText>(R.id.etPass); val status=v.findViewById<android.widget.TextView>(R.id.tvStatus)\n v.findViewById<android.widget.Button>(R.id.btnLogin).setOnClickListener{if(pass.text.toString()=="matreshka"){ChatStore.isAdmin=true; status.text="Ты теперь АДМИН! Можешь назначать, удалять, отвечать."} else status.text="Неверный пароль"}\n v.findViewById<android.widget.Button>(R.id.btnClear).setOnClickListener{if(ChatStore.isAdmin){ChatStore.msgs.clear(); status.text="Чат очищен"} else status.text="Только админ может чистить"}\n}}\n')
          PY
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Chat
          path: app/build/outputs/apk/debug/app-debug.apk
