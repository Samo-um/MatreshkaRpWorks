name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p app/src/main/java/com/matreshka/works
          cat > settings.gradle <<'G'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          include ':app'
          G
          cat > build.gradle <<'G'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
          }
          G
          cat > app/build.gradle <<'G'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.matreshka.works'
            compileSdk 34
            defaultConfig {
              applicationId 'com.matreshka.works'
              minSdk 24
              targetSdk 34
            }
          }
          G
          cat > app/src/main/AndroidManifest.xml <<'M'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Matreshka">
              <activity android:name=".MainActivity" android:exported
