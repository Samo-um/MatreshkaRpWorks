name: MATRESHKA WORKS CHAT
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: |
          rm -rf app
          mkdir -p app/src/main/java/com/matreshka/works
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/assets
          echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' > gradle.properties
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}} include ":app"' > settings.gradle
          echo 'plugins{id "com.android.application" version "8.2.2" apply false}' > build.gradle
          
          cat > app/build.gradle <<'EOF'
          plugins{id "com.android.application"}
          android{namespace "com.matreshka.works";compileSdk 34;defaultConfig{applicationId "com.matreshka.works";minSdk 24;targetSdk 34;versionCode 50;versionName "50MB-VERIFIED"}}
          dependencies{implementation "androidx.appcompat:appcompat:1.6.1";implementation "com.google.android.material:material:1.11.0";implementation "androidx.recyclerview:recyclerview:1.3.2"}
          EOF

          python3 -c "
          import os
          f=open('app/src/main/assets/data.mp4','wb')
          for i in range(5):
              f.write(os.urandom(10*1024*1024))
              print(f'{i+1}0MB done')
          f.close()
          "

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="MATRESHKA WORKS CHAT ✓" android:theme="@android:style/Theme.Material.Light.DarkActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          echo '<resources><string name="app_name">MATRESHKA WORKS CHAT ✓</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:background="#070A18" android:layout_width="match_parent" android:layout_height="match_parent"><LinearLayout android:background="#0F122E" android:padding="12dp" android:layout_width="match_parent" android:layout_height="wrap_content"><TextView android:text="MATRESHKA WORKS CHAT ✓" android:textColor="#FFF" android:textStyle="bold" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/><TextView android:text="27 SRV" android:textColor="#1DA1F2" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout><Button android:id="@+id/ask" android:text="❓ ЗАДАТЬ ВОПРОС - ДИРЕКТОР ОТВЕТИТ В БЛИЖАЙШЕЕ ВРЕМЯ" android:layout_width="match_parent" android:layout_height="wrap_content"/><androidx.recyclerview.widget.RecyclerView android:id="@+id/rv" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          EOF
          cat > app/src/main/java/com/matreshka/works/MainActivity.kt <<'EOF'
          package com.matreshka.works
          import android.app.AlertDialog
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import android.view.ViewGroup
          import android.view.View
          data class Job(val t:String,val p:String,val d:String,val desc:String)
          object DB{val jobs=listOf(Job("1. Перепродажа оружия 🔫","💵 Оплата: 15.000 ₽","📆 В день: 10.000 ₽","Скрытая работа"),Job("2. Продажа одежды 🧥","💵 Оплата: 20.000 ₽","📆 В день: 10.000 ₽","Бутик"),Job("3. Скрытие авто 🚘","💵 Зарплата: 20.000 ₽","","Ночная"),Job("4. Строительный бизнес 🚚","💵 Зарплата: 75.000 ₽","(+10.000 ₽ / рейс)","Возишь материалы"),Job("5. Таксист 🚖","💵 Зарплата: 5.000 ₽","(+5.000 ₽ / рейс)","Классика"),Job("6. Барыга 💎","💵 Начать: 200.000 ₽","💰 Зарплата: 100.000 ₽","Серьезный бизнес"),Job("7. Директор стройки 🏢","💵 Начать: 700.000 ₽","💰 Зарплата: 276.000 ₽","ТОП"),Job("8. Карты и рейды ⭐","💵 Оплата: 45.000 ₽","","Ответственная"))}
          class MainActivity:AppCompatActivity(){
            override fun onCreate(b:Bundle?){super.onCreate(b);setContentView(R.layout.activity_main)
              val rv=findViewById<RecyclerView>(R.id.rv);rv.layoutManager=LinearLayoutManager(this)
              rv.adapter=object:RecyclerView.Adapter<VH>(){
                override fun onCreateViewHolder(p:ViewGroup,t:Int):VH{val l=LinearLayout(p.context);l.orientation=1;l.setPadding(24,16,24,16);val a=TextView(p.context);a.textSize=16f;a.setTextColor(-1);val b=TextView(p.context);b.setTextColor(-5592406);l.addView(a);l.addView(b);return VH(l,a,b)}
                override fun getItemCount()=DB.jobs.size
                override fun onBindViewHolder(h:VH,i:Int){val j=DB.jobs[i];h.a.text=j.t;h.b.text=j.p+" | "+j.d;h.itemView.setOnClickListener{val e=EditText(this@MainActivity);AlertDialog.Builder(this@MainActivity).setTitle(j.t).setMessage("${j.p}\n${j.d}\n\n${j.desc}\n\nЗадать вопрос Директору?").setView(e).setPositiveButton("Отправить Директору ✓"){_,_->Toast.makeText(this@MainActivity,"Вопрос по ${j.t} отправлен ✓ Директор ответит в ближайшее время",1).show()}.show()}}
              }
              findViewById<Button>(R.id.ask).setOnClickListener{val e=EditText(this);AlertDialog.Builder(this).setTitle("❓ ЗАДАТЬ ВОПРОС ДИРЕКТОРУ").setMessage("В ближайшее время вам ответит Директор ✓").setView(e).setPositiveButton("Отправить"){_,_->Toast.makeText(this,"Отправлено Директору ✓",1).show()}.show()}
            }
            class VH(v:View,val a:TextView,val b:TextView):RecyclerView.ViewHolder(v)
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:assembleDebug
      - run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: MATRESHKA-WORKS-CHAT-50MB
          path: app/build/outputs/apk/debug/app-debug.apk
