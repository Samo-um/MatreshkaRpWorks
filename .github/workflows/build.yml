name: Build MatreshkaRP APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o MATRESHKARP_WORKS_online_project.zip && rm MATRESHKARP_WORKS_online_project.zip && if [ -d "MATRESHKARP_WORKS_online_project" ]; then mv MATRESHKARP_WORKS_online_project/_ .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MatreshkaRP-APK
          path: android/app/build/outputs/apk/debug/_.apk
