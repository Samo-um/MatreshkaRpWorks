name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o *.zip || true
          rm *.zip || true
          mv */* . 2>/dev/null || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: "**/*.apk"
